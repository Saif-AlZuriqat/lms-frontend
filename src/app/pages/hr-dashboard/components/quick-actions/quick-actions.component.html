<div class="hr-section-card hr-quick-card">
  <div class="hr-section-header">
    <h2>Quick Actions</h2>
  </div>
  <div class="hr-quick-list">
    <a routerLink="/hr/create-user" class="hr-quick-item">
      <div class="hr-quick-icon">
        <span class="material-symbols-outlined">person_add</span>
      </div>
      <div class="hr-quick-info">
        <span class="hr-quick-label">Create New User</span>
        <span class="hr-quick-sub">Onboard team members</span>
      </div>
      <span class="material-symbols-outlined hr-quick-arrow">arrow_forward</span>
    </a>
    <a routerLink="/hr/assign-path" class="hr-quick-item">
      <div class="hr-quick-icon">
        <span class="material-symbols-outlined">route</span>
      </div>
      <div class="hr-quick-info">
        <span class="hr-quick-label">Assign Learning Path</span>
        <span class="hr-quick-sub">Enroll employee in a path</span>
      </div>
      <span class="material-symbols-outlined hr-quick-arrow">arrow_forward</span>
    </a>
    @if (canApproveExtensions()) {
      <a routerLink="/hr/extension-requests" class="hr-quick-item">
        <div class="hr-quick-icon">
          <span class="material-symbols-outlined">pending_actions</span>
        </div>
        <div class="hr-quick-info">
          <span class="hr-quick-label">Extension Requests</span>
          <span class="hr-quick-sub">Review deadline extensions</span>
        </div>
        <span class="material-symbols-outlined hr-quick-arrow">arrow_forward</span>
      </a>
    }
  </div>
</div>
